# Deploy dashboard to Pages (also with zero data — so the site is never README).
name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bvg-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard (empty state ok)
        run: |
          pip install -r requirements.txt
          python dashboard/build_html.py

      - name: Prepare static site
        run: |
          mkdir -p site
          cp dashboard/index.html site/index.html
          cp dashboard/index.html index.html
          touch site/.nojekyll .nojekyll

      - name: Commit root index.html (Pages from main branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          git diff --staged --quiet || git commit -m "Update dashboard [skip ci]"
          git push

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
