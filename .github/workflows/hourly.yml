# BVG-Störungen alle 20 Minuten (Europe/Berlin :00, :20, :40)
name: BVG hourly scrape

on:
  schedule:
    - cron: "0,20,40 * * * *"
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      force:
        description: "Snapshot auch wenn dieses 20-Min-Fenster schon existiert"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: bvg-hourly
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore SQLite database
        uses: actions/cache@v4
        with:
          path: data/
          key: disruptions-db-v1
          restore-keys: |
            disruptions-db-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector (20-min slot)
        run: |
          mkdir -p data/logs
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python -m collector.hourly $ARGS --skip-html

      - name: Build dashboard
        run: python dashboard/build_html.py

      - name: Publish dashboard to main (GitHub Pages)
        run: |
          cp dashboard/index.html /tmp/bvg-dashboard.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/bvg-dashboard.html index.html
          touch .nojekyll
          git add index.html .nojekyll
          if git diff --staged --quiet; then
            echo "Dashboard unchanged, skip push"
            exit 0
          fi
          git commit -m "Dashboard update [skip ci]"
          git push origin main

      - name: Weekly DB backup artifact
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             { [ "$(date -u +%w)" = "0" ] && [ "$(date -u +%H)" = "00" ]; }; then
            echo "upload_backup=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        if: env.upload_backup == 'true'
        with:
          name: disruptions-db-backup-${{ github.run_number }}
          path: data/disruptions.db
          retention-days: 90
          if-no-files-found: ignore

  # GitHub cron on new repos is often delayed 24h+; chain keeps ~20 min cadence.
  queue-next:
    needs: scrape
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const delayMs = 20 * 60 * 1000;
            core.info(`Next scrape in ${delayMs / 60000} minutes…`);
            await new Promise((resolve) => setTimeout(resolve, delayMs));
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "hourly.yml",
              ref: "main",
            });
            core.info("Dispatched next BVG hourly scrape");
