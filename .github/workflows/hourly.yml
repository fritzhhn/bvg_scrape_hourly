# Stündlicher BVG-Scrape + Dashboard auf GitHub Pages (Actions-Deploy, nicht README).
name: BVG hourly scrape

on:
  schedule:
    - cron: "0 * * * *"
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      force:
        description: "Snapshot auch wenn diese Stunde schon existiert"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bvg-pages
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore SQLite database
        uses: actions/cache@v4
        with:
          path: data/
          key: disruptions-db-v1
          restore-keys: |
            disruptions-db-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly collector
        run: |
          mkdir -p data/logs
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python -m collector.hourly $ARGS --skip-html

      - name: Build dashboard
        run: python dashboard/build_html.py

      - name: Prepare static site (only dashboard, not README)
        run: |
          mkdir -p site
          cp dashboard/index.html site/index.html
          cp dashboard/index.html index.html
          touch site/.nojekyll .nojekyll

      - name: Commit root index.html (Pages from main branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          git diff --staged --quiet || git commit -m "Update dashboard [skip ci]"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Weekly DB backup artifact
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             { [ "$(date -u +%w)" = "0" ] && [ "$(date -u +%H)" = "00" ]; }; then
            echo "upload_backup=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        if: env.upload_backup == 'true'
        with:
          name: disruptions-db-backup-${{ github.run_number }}
          path: data/disruptions.db
          retention-days: 90
          if-no-files-found: ignore
