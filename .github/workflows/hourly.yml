# Stündlicher BVG-Scrape — ohne github-pages Environment (blockiert Schedule).
name: BVG hourly scrape

on:
  schedule:
    - cron: "0 * * * *"
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      force:
        description: "Snapshot auch wenn diese Stunde schon existiert"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bvg-hourly
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore SQLite database
        uses: actions/cache@v4
        with:
          path: data/
          key: disruptions-db-v1
          restore-keys: |
            disruptions-db-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly collector
        run: |
          mkdir -p data/logs
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python -m collector.hourly $ARGS --skip-html

      - name: Build dashboard
        run: python dashboard/build_html.py

      - name: Publish dashboard to main (GitHub Pages)
        run: |
          cp dashboard/index.html index.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          git diff --staged --quiet || git commit -m "Dashboard update [skip ci]"
          git push

      - name: Weekly DB backup artifact
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             { [ "$(date -u +%w)" = "0" ] && [ "$(date -u +%H)" = "00" ]; }; then
            echo "upload_backup=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        if: env.upload_backup == 'true'
        with:
          name: disruptions-db-backup-${{ github.run_number }}
          path: data/disruptions.db
          retention-days: 90
          if-no-files-found: ignore
